<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Love, without borders</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans", "Noto Sans Arabic", sans-serif;
      background: #09090b;
      color: #f5f2f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --rose: #ed4558;
      --ivory: #f5f2f2;
      --muted: #aaa2a4;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 44%, #351419 0%, #1a1012 31%, #09090b 72%);
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: min(100%, 1120px);
      min-width: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vh, 52px) 20px;
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      width: min(64vw, 680px);
      aspect-ratio: 1;
      border: 1px solid #ffffff0b;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .scene::after {
      width: min(48vw, 510px);
      border-color: #ffffff09;
    }

    .composition {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: clamp(20px, 3.5vh, 38px);
    }

    .heading {
      display: grid;
      justify-items: center;
      gap: 10px;
      text-align: center;
      opacity: 0;
      animation: reveal 1.4s ease-out .25s forwards;
    }

    .eyebrow {
      color: var(--ivory);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f5f2f2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      font-weight: 400;
      letter-spacing: .06em;
    }

    .heart-stage {
      position: relative;
      width: min(84vw, 460px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      animation: rise-once 8s cubic-bezier(.2,.72,.24,1) .4s both;
    }

    .heart-stage::before {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ed45583d;
      content: "";
      filter: blur(70px);
      transform: translate(-50%, -50%);
      animation: glow 5s ease-in-out 8.4s infinite;
      pointer-events: none;
    }

    .heart-canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-canvas:focus-visible {
      outline: 1px solid #ff778480;
      outline-offset: -12%;
      border-radius: 50%;
    }

    .footnote {
      margin: 0;
      color: var(--muted);
      font-size: .67rem;
      font-weight: 400;
      letter-spacing: .24em;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      animation: reveal 1s ease-out 7.5s forwards;
    }

    .language-message {
      margin: 0;
      min-height: 38px;
      display: grid;
      justify-items: center;
      gap: 7px;
      text-align: center;
      opacity: 0;
      animation: reveal 1s ease-out 2s forwards;
    }

    .message-label {
      color: var(--muted);
      font-size: .58rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .language-phrase {
      color: var(--ivory);
      font-family: Georgia, "Times New Roman", "Noto Serif", serif;
      font-size: clamp(16px, 2.4vw, 21px);
      line-height: 1.4;
      text-shadow: 0 0 22px #ed455845;
    }

    .touch-note {
      margin: 0;
      color: #bdb5b7;
      font-size: .56rem;
      letter-spacing: .18em;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      animation: reveal 1s ease-out 3s forwards;
    }

    @keyframes reveal {
      to { opacity: 1; }
    }

    @keyframes rise-once {
      0% { transform: translateY(24vh) scale(.91); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes glow {
      0%, 100% { opacity: .48; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: .9; transform: translate(-50%, -50%) scale(1.16); }
    }

    @media (max-width: 600px) {
      .scene { padding-inline: 12px; }
      .heart-stage { width: min(88vw, 390px); }
      .eyebrow { letter-spacing: .25em; }
    }

    @media (max-height: 700px) {
      .composition { gap: 14px; }
      .heart-stage { width: min(68vw, 320px); }
      .footnote { font-size: .58rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .heading, .footnote { opacity: 1; }
      .language-message, .touch-note { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="composition" aria-labelledby="title">
      <header class="heading">
        <span class="eyebrow">Across every distance</span>
        <h1 id="title">Love, without borders</h1>
      </header>
      <div class="heart-stage">
        <canvas class="heart-canvas" id="heart-canvas" role="button" tabindex="0" aria-label="A glowing heart made of light. Tap to send a spark."></canvas>
      </div>
      <p class="language-message" aria-label="I love you in 31 languages">
        <span class="message-label">I love you, in every language</span>
        <span class="language-phrase" id="language-phrase" lang="en">I love you</span>
      </p>
      <p class="touch-note">Tap the heart to send a spark</p>
      <p class="footnote">One feeling · countless ways to say it</p>
    </section>
  </main>
  <script>
    const messages = [
      { text: "I love you", lang: "en" },
      { text: "أحبك", lang: "ar" },
      { text: "Je t’aime", lang: "fr" },
      { text: "Te quiero", lang: "es" },
      { text: "Eu te amo", lang: "pt" },
      { text: "Ti amo", lang: "it" },
      { text: "Ich liebe dich", lang: "de" },
      { text: "Seni seviyorum", lang: "tr" },
      { text: "Kanbghik", lang: "ary" },
      { text: "我爱你", lang: "zh" },
      { text: "愛してる", lang: "ja" },
      { text: "사랑해", lang: "ko" },
      { text: "Σ’ αγαπώ", lang: "el" },
      { text: "Я тебя люблю", lang: "ru" },
      { text: "मुझे तुमसे प्यार है", lang: "hi" },
      { text: "আমি তোমাকে ভালোবাসি", lang: "bn" },
      { text: "Nakupenda", lang: "sw" },
      { text: "Aku cinta kamu", lang: "id" },
      { text: "ฉันรักคุณ", lang: "th" },
      { text: "دوستت دارم", lang: "fa" },
      { text: "Kocham cię", lang: "pl" },
      { text: "Ik hou van jou", lang: "nl" },
      { text: "Jag älskar dig", lang: "sv" },
      { text: "Jeg elsker deg", lang: "no" },
      { text: "Te iubesc", lang: "ro" },
      { text: "Я тебе кохаю", lang: "uk" },
      { text: "Mahal kita", lang: "fil" },
      { text: "Te amo", lang: "la" },
      { text: "Volim te", lang: "hr" },
      { text: "T’estimo", lang: "ca" },
      { text: "Ljubim te", lang: "sl" }
    ];

    const canvas = document.querySelector("#heart-canvas");
    const context = canvas.getContext("2d");
    const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
    const random = (min, max) => min + Math.random() * (max - min);
    const heartPoint = angle => {
      const sine = Math.sin(angle);
      const cosine = Math.cos(angle);
      const x = 200 + 8.5 * 16 * sine ** 3;
      const curve = 13 * cosine - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
      const y = 200 - 8.5 * (curve + 3);
      return { x, y };
    };
    const heartPath = new Path2D();
    const particles = [];
    const heartDust = [];
    const sparks = [];
    const starField = [];
    const comets = [];
    const bursts = [];
    let canvasSize = 0;
    let pixelRatio = 1;
    let previousFrame = 0;
    let elapsed = 0;
    let pointerX = 0;
    let pointerY = 0;
    let meteor = null;
    let nextMeteorAt = 2;

    for (let i = 0; i <= 480; i += 1) {
      const point = heartPoint((i / 480) * Math.PI * 2);
      if (i === 0) heartPath.moveTo(point.x, point.y);
      else heartPath.lineTo(point.x, point.y);
    }
    heartPath.closePath();

    for (let i = 0; i < 760; i += 1) {
      const angle = (i / 760) * Math.PI * 2 + random(-0.002, 0.002);
      const point = heartPoint(angle);
      const next = heartPoint(angle + 0.01);
      const tangentX = next.x - point.x;
      const tangentY = next.y - point.y;
      const tangentLength = Math.hypot(tangentX, tangentY);
      const offset = random(-2.5, 2.5);
      particles.push({
        x: point.x - (tangentY / tangentLength) * offset,
        y: point.y + (tangentX / tangentLength) * offset,
        size: random(0.45, 1.55),
        phase: random(0, Math.PI * 2),
        speed: random(1, 2.8),
        tint: Math.random()
      });
    }

    for (let attempt = 0; attempt < 1200 && heartDust.length < 110; attempt += 1) {
      const x = random(58, 342);
      const y = random(68, 370);
      if (context.isPointInPath(heartPath, x, y)) {
        heartDust.push({
          x,
          y,
          size: random(0.35, 0.9),
          phase: random(0, Math.PI * 2)
        });
      }
    }

    for (let i = 0; i < 44; i += 1) {
      sparks.push({
        angle: random(0, Math.PI * 2),
        speed: random(0.12, 0.32) * (Math.random() < 0.5 ? -1 : 1),
        size: random(0.6, 2),
        phase: random(0, Math.PI * 2)
      });
    }

    for (let i = 0; i < 90; i += 1) {
      starField.push({
        x: random(0, 1),
        y: random(0, 1),
        size: random(0.35, 1.25),
        phase: random(0, Math.PI * 2),
        drift: random(0.002, 0.012),
        tint: Math.random()
      });
    }

    for (let i = 0; i < 3; i += 1) {
      comets.push({
        phase: (i / 3) * Math.PI * 2,
        speed: (i % 2 ? -1 : 1) * random(0.22, 0.34),
        radiusX: random(0.35, 0.43),
        radiusY: random(0.31, 0.4),
        tilt: random(-0.5, 0.5),
        size: random(1.4, 2.4)
      });
    }

    function resizeCanvas() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvasSize = Math.max(1, canvas.clientWidth);
      canvas.width = Math.round(canvasSize * pixelRatio);
      canvas.height = Math.round(canvasSize * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function heartScale(time) {
      if (motionPreference.matches) return 1;
      const beat = time % 4.8;
      const first = Math.exp(-Math.pow((beat - 0.42) / 0.13, 2)) * 0.045;
      const second = Math.exp(-Math.pow((beat - 0.78) / 0.16, 2)) * 0.027;
      return 1 + first + second;
    }

    function drawHeart(time) {
      const size = canvasSize;
      const scale = size / 400;
      const pulse = heartScale(time);
      const sway = motionPreference.matches ? 0 : Math.sin(time * 0.62);
      const centerX = size / 2 + sway * size * 0.025 + pointerX * size * 0.018;
      const centerY = size / 2 + Math.cos(time * 0.8) * size * 0.009 + pointerY * size * 0.012;

      context.clearRect(0, 0, size, size);
      for (const star of starField) {
        const x = ((star.x + time * star.drift) % 1) * size;
        const y = star.y * size + pointerY * star.size * 3;
        const shimmer = 0.16 + (Math.sin(time * 1.7 + star.phase) + 1) * 0.22;
        context.beginPath();
        context.fillStyle = star.tint > 0.82
          ? `rgba(255,245,245,${shimmer})`
          : `rgba(255,91,105,${shimmer})`;
        context.arc(x, y, star.size * (0.65 + shimmer), 0, Math.PI * 2);
        context.fill();
      }

      const nebula = context.createRadialGradient(centerX, centerY, size * 0.04, centerX, centerY, size * 0.49);
      nebula.addColorStop(0, "#ed263b1c");
      nebula.addColorStop(0.42, "#8f172413");
      nebula.addColorStop(1, "#28090e00");
      context.fillStyle = nebula;
      context.fillRect(0, 0, size, size);

      context.save();
      context.translate(centerX, centerY);
      context.rotate(sway * 0.15 + pointerX * 0.12);
      context.scale(scale * pulse * (1 + sway * 0.075 - Math.abs(pointerX) * 0.1), scale * pulse);
      context.translate(-200, -200);

      const aura = context.createRadialGradient(200, 190, 18, 200, 190, 185);
      aura.addColorStop(0, "#ff465845");
      aura.addColorStop(0.6, "#ed263b20");
      aura.addColorStop(1, "#ed263b00");
      context.fillStyle = aura;
      context.beginPath();
      context.arc(200, 190, 185, 0, Math.PI * 2);
      context.fill();

      context.save();
      context.clip(heartPath);
      const heartNebula = context.createRadialGradient(200, 194, 8, 200, 194, 168);
      heartNebula.addColorStop(0, "#ff465824");
      heartNebula.addColorStop(0.48, "#c91e321a");
      heartNebula.addColorStop(1, "#570b1300");
      context.fillStyle = heartNebula;
      context.fillRect(20, 20, 360, 360);
      context.globalCompositeOperation = "screen";
      context.translate(200, 195);
      context.rotate(time * 0.14);
      context.scale(1.25, 0.58);
      context.beginPath();
      context.arc(0, 0, 84, -0.5, Math.PI * 1.42);
      context.strokeStyle = "#ff657024";
      context.lineWidth = 9;
      context.shadowColor = "#ff5265";
      context.shadowBlur = 22;
      context.stroke();
      context.beginPath();
      context.arc(0, 0, 55, 1.9, Math.PI * 2.9);
      context.strokeStyle = "#ff526520";
      context.lineWidth = 6;
      context.shadowColor = "#ff5265";
      context.shadowBlur = 18;
      context.stroke();
      context.restore();

      context.shadowColor = "#ff5265";
      context.shadowBlur = 21 + Math.sin(time * 2) * 9;
      context.lineWidth = 1.8;
      context.strokeStyle = `rgba(255,245,245,${0.38 + Math.sin(time * 2.4) * 0.12})`;
      context.stroke(heartPath);
      context.shadowBlur = 0;

      for (const particle of particles) {
        const shimmer = 0.2 + (Math.sin(time * particle.speed + particle.phase) + 1) * 0.37;
        const color = particle.tint > 0.93
          ? `rgba(255,250,250,${shimmer})`
          : particle.tint > 0.7
            ? `rgba(255,112,124,${shimmer})`
            : `rgba(255,${38 + Math.round(particle.tint * 28)},${50 + Math.round(particle.tint * 24)},${shimmer})`;
        context.beginPath();
        context.fillStyle = color;
        context.shadowColor = particle.tint > 0.7 ? "#ff9aa4" : "#ed263b";
        context.shadowBlur = particle.size > 1.1 ? 3.5 + shimmer * 2 : 0;
        context.arc(particle.x, particle.y, particle.size * (0.6 + shimmer * 0.55), 0, Math.PI * 2);
        context.fill();
      }

      context.shadowBlur = 0;
      for (const mote of heartDust) {
        const shimmer = 0.08 + (Math.sin(time * 1.4 + mote.phase) + 1) * 0.08;
        context.beginPath();
        context.fillStyle = `rgba(255,91,105,${shimmer})`;
        context.arc(mote.x, mote.y, mote.size, 0, Math.PI * 2);
        context.fill();
      }
      context.restore();

      context.save();
      context.translate(centerX, centerY);
      context.rotate(time * 0.22);
      context.scale(1, 0.72);
      context.beginPath();
      context.ellipse(0, 0, size * 0.43, size * 0.43, 0, 0, Math.PI * 2);
      context.strokeStyle = "#ffffff28";
      context.lineWidth = 1.2;
      context.shadowColor = "#ff5265";
      context.shadowBlur = 8;
      context.stroke();
      context.save();
      context.rotate(1.02);
      context.beginPath();
      context.ellipse(0, 0, size * 0.39, size * 0.49, 0, 0, Math.PI * 2);
      context.strokeStyle = "#ff526524";
      context.stroke();
      context.restore();

      for (const comet of comets) {
        const angle = comet.phase + time * comet.speed;
        const orbitX = Math.cos(angle) * size * comet.radiusX;
        const orbitY = Math.sin(angle) * size * comet.radiusY;
        const x = orbitX * Math.cos(comet.tilt) - orbitY * Math.sin(comet.tilt);
        const y = orbitX * Math.sin(comet.tilt) + orbitY * Math.cos(comet.tilt);
        const tailX = Math.sin(angle) * comet.speed * size * comet.radiusX * 0.16;
        const tailY = -Math.cos(angle) * comet.speed * size * comet.radiusY * 0.16;
        const tail = context.createLinearGradient(x - tailX, y - tailY, x, y);
        tail.addColorStop(0, "#ff526500");
        tail.addColorStop(1, "#fff5f5cc");
        context.beginPath();
        context.moveTo(x - tailX, y - tailY);
        context.lineTo(x, y);
        context.strokeStyle = tail;
        context.lineWidth = comet.size * 2;
        context.shadowColor = "#ff5265";
        context.shadowBlur = 16;
        context.stroke();
        context.beginPath();
        context.fillStyle = "#fffafa";
        context.arc(x, y, comet.size * (1.1 + (Math.sin(time * 5 + comet.phase) + 1) * 0.35), 0, Math.PI * 2);
        context.fill();
      }

      for (const spark of sparks) {
        const angle = spark.angle + time * spark.speed;
        const twinkle = 0.35 + (Math.sin(time * 2.2 + spark.phase) + 1) * 0.32;
        const x = Math.cos(angle) * size * 0.43;
        const y = Math.sin(angle) * size * 0.43;
        context.beginPath();
        context.fillStyle = `rgba(255,${210 + Math.round(twinkle * 35)},${212 + Math.round(twinkle * 35)},${twinkle})`;
        context.shadowColor = "#ff5265";
        context.shadowBlur = 8;
        context.arc(x, y, spark.size * twinkle, 0, Math.PI * 2);
        context.fill();
      }
      context.restore();

      for (let i = bursts.length - 1; i >= 0; i -= 1) {
        const burst = bursts[i];
        const age = (time - burst.start) / 1.25;
        if (age >= 1) {
          bursts.splice(i, 1);
          continue;
        }
        for (const ray of burst.rays) {
          const distance = age * ray.distance;
          context.beginPath();
          context.fillStyle = `rgba(255,${210 + Math.round(35 * (1 - age))},${212 + Math.round(35 * (1 - age))},${1 - age})`;
          context.shadowColor = "#ff5265";
          context.shadowBlur = 10;
          context.arc(burst.x + Math.cos(ray.angle) * distance, burst.y + Math.sin(ray.angle) * distance, ray.size * (1 - age * 0.55), 0, Math.PI * 2);
          context.fill();
        }
      }
      context.shadowBlur = 0;

      if (!motionPreference.matches && time > nextMeteorAt) {
        meteor = {
          start: time,
          x: random(size * 0.08, size * 0.92),
          y: random(size * 0.02, size * 0.35),
          length: random(size * 0.14, size * 0.28),
          angle: random(0.72, 1.05)
        };
        nextMeteorAt = time + random(3.2, 6.5);
      }
      if (meteor) {
        const age = (time - meteor.start) / 0.72;
        if (age >= 1) {
          meteor = null;
        } else {
          const x = meteor.x + Math.cos(meteor.angle) * size * 0.55 * age;
          const y = meteor.y + Math.sin(meteor.angle) * size * 0.55 * age;
          const tailX = Math.cos(meteor.angle) * meteor.length * (1 - age);
          const tailY = Math.sin(meteor.angle) * meteor.length * (1 - age);
          const trail = context.createLinearGradient(x - tailX, y - tailY, x, y);
          trail.addColorStop(0, "#ff526500");
          trail.addColorStop(1, "#fff5f5e6");
          context.beginPath();
          context.moveTo(x - tailX, y - tailY);
          context.lineTo(x, y);
          context.strokeStyle = trail;
          context.lineWidth = 1.5 * (1 - age * 0.45);
          context.shadowColor = "#ff5265";
          context.shadowBlur = 12;
          context.stroke();
        }
      }
    }

    function animate(now) {
      if (!previousFrame) previousFrame = now;
      elapsed += Math.min((now - previousFrame) / 1000, 0.05);
      previousFrame = now;
      drawHeart(elapsed);
      if (!motionPreference.matches) window.requestAnimationFrame(animate);
    }

    function createBurst(event) {
      const bounds = canvas.getBoundingClientRect();
      const x = ((event.clientX - bounds.left) / bounds.width) * canvasSize;
      const y = ((event.clientY - bounds.top) / bounds.height) * canvasSize;
      bursts.push({
        x,
        y,
        start: elapsed,
        rays: Array.from({ length: 38 }, () => ({
          angle: random(0, Math.PI * 2),
          distance: random(canvasSize * 0.16, canvasSize * 0.42),
          size: random(1.2, 3.2)
        }))
      });
      if (motionPreference.matches) drawHeart(elapsed);
    }

    canvas.addEventListener("click", createBurst);
    canvas.addEventListener("pointermove", event => {
      const bounds = canvas.getBoundingClientRect();
      pointerX = Math.max(-1, Math.min(1, (event.clientX - bounds.left - bounds.width / 2) / (bounds.width / 2)));
      pointerY = Math.max(-1, Math.min(1, (event.clientY - bounds.top - bounds.height / 2) / (bounds.height / 2)));
    });
    canvas.addEventListener("pointerleave", () => {
      pointerX = 0;
      pointerY = 0;
    });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        const bounds = canvas.getBoundingClientRect();
        createBurst({ clientX: bounds.left + bounds.width / 2, clientY: bounds.top + bounds.height / 2 });
      }
    });

    const resizeObserver = new ResizeObserver(resizeCanvas);
    resizeObserver.observe(canvas);
    resizeCanvas();
    drawHeart(0);
    window.requestAnimationFrame(animate);

    if (!motionPreference.matches) {
      const languagePhrase = document.querySelector("#language-phrase");
      let rotatingMessageIndex = 0;
      window.setInterval(() => {
        rotatingMessageIndex = (rotatingMessageIndex + 1) % messages.length;
        const message = messages[rotatingMessageIndex];
        languagePhrase.animate(
          [{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: 450, easing: "ease-out" }
        );
        languagePhrase.textContent = message.text;
        languagePhrase.lang = message.lang;
        languagePhrase.dir = message.lang === "ar" || message.lang === "fa" ? "rtl" : "auto";
      }, 2400);
    }
  </script>
</body>
</html>
